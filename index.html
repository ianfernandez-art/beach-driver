<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyundai Creta 25/26 - Coastline Highway Cruise</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 900px;
            height: 480px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 120, 50, 0.2);
            overflow: hidden;
            border: 2px solid #2a3447;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* HUD - Painel Digital */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .hud-value {
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        .speed-high {
            color: #f43f5e !important;
            text-shadow: 0 0 8px rgba(244, 63, 94, 0.6) !important;
        }

        /* Speech Bubble for Checkpoint */
        #speech-bubble {
            display: none;
            position: absolute;
            top: 215px;
            left: 175px;
            background: #ffffff;
            color: #0f172a;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            border: 2px solid #0f172a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 25;
            white-space: nowrap;
            animation: bounce 0.4s infinite alternate;
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }

        /* Game Over Modal */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.88);
            backdrop-filter: blur(6px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #game-over-msg {
            color: #ff3344;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 51, 68, 0.6);
            margin-bottom: 12px;
            text-align: center;
            padding: 0 20px;
        }

        .sub-msg {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.6);
        }

        /* Controls Hint Bar */
        #controls-info {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #cbd5e1;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- HUD -->
    <div id="hud">
        <div class="hud-card">
            <div>
                <div class="hud-title">Velocidade</div>
                <div class="hud-value" id="speed-val">100 <span style="font-size: 12px;">km/h</span></div>
            </div>
        </div>

        <div class="hud-card">
            <div>
                <div class="hud-title">Distância</div>
                <div class="hud-value" id="km-val">0.00 <span style="font-size: 12px;">km</span></div>
            </div>
        </div>

        <div class="hud-card">
            <div>
                <div class="hud-title">Horário</div>
                <div class="hud-value" id="time-val" style="color: #fbbf24;">17:30</div>
            </div>
        </div>
    </div>

    <!-- Speech Bubble for Driver -->
    <div id="speech-bubble">Tá de sacanagem?!</div>

    <!-- TELA DE GAME OVER -->
    <div id="game-over-screen">
        <h1 id="game-over-msg">Tá com pressa trouxa?!</h1>
        <p class="sub-msg">Você bateu o seu Hyundai Creta!</p>
        <button class="restart-btn" onclick="restartGame()">Pressionar ESPAÇO para Jogar Novamente</button>
    </div>

    <div id="controls-info">
        Controles: <b>&gt;</b> Acelera | <b>&lt;</b> Freia (Mín. 100 km/h) | <b>&Hat; &vArr;</b> Troca de Pista (4 Faixas)
    </div>

    <canvas id="gameCanvas" width="900" height="480"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const speedVal = document.getElementById('speed-val');
const kmVal = document.getElementById('km-val');
const timeVal = document.getElementById('time-val');
const gameOverScreen = document.getElementById('game-over-screen');
const speechBubble = document.getElementById('speech-bubble');

// CONFIGURAÇÃO DAS 4 FAIXAS (Pista da Rodovia da Praia)
const LANES = [255, 305, 355, 405];
const LANE_HEIGHT = 50;

// PARÂMETROS DO JOGO
const MIN_SPEED = 100; // Velocidade mínima travada em 100 km/h
let speed = MIN_SPEED;
let distanceMeters = 0;
let gameOver = false;
let keys = {};

// CHECKPOINT MECHANIC (At Exactly 5.00 km / 5000 meters)
let checkpointTriggered = false;
let checkpointState = 'IDLE'; // 'IDLE' -> 'SLOWING' -> 'SPEECH' -> 'BOOSTING' -> 'COMPLETED'
let checkpointTimer = 0;
let checkpointBoothX = -200;

// RELÓGIO & CICLO DE TEMPO (Duração lenta de 3 minutos)
let timeMinutes = 17 * 60 + 30; // Começa às 17:30
let frameCounter = 0;

// JOGADOR (Hyundai Creta 25/26 Cinza)
const player = {
    x: 120,
    y: LANES[1] - 22,
    width: 110,
    height: 44,
    lane: 1,
    targetY: LANES[1] - 22,
    canChangeLane: true
};

// ELEM. DO CENÁRIO (Coqueiros e Tráfego)
let palmTrees = [];
let obstacles = [];
let spawnTimer = 0;

// Inicialização de Coqueiros ao longo da orla
for (let i = 0; i < 10; i++) {
    palmTrees.push({
        x: i * 110,
        height: 50 + Math.random() * 20,
        scale: 0.8 + Math.random() * 0.4
    });
}

// CONTROLES DE TECLADO
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;

    if (gameOver && e.code === 'Space') {
        restartGame();
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        player.canChangeLane = true;
    }
});

function restartGame() {
    speed = MIN_SPEED;
    distanceMeters = 0;
    gameOver = false;
    checkpointTriggered = false;
    checkpointState = 'IDLE';
    checkpointTimer = 0;
    checkpointBoothX = -200;
    speechBubble.style.display = 'none';

    player.lane = 1;
    player.y = LANES[1] - 22;
    player.targetY = LANES[1] - 22;
    timeMinutes = 17 * 60 + 30;
    frameCounter = 0;
    obstacles = [];
    gameOverScreen.style.display = 'none';
    requestAnimationFrame(gameLoop);
}

function drawCreta25(x, y) {
    // Sombra do Veículo
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath();
    ctx.ellipse(x + 55, y + 42, 52, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Caixas de Roda Esportivas / Proteções de Plástico Preto
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + 10, y + 30, 90, 10);

    // Carroceria Principal (Cinza Metalizado Moderno)
    ctx.fillStyle = '#64748b';
    ctx.fillRect(x + 10, y + 14, 88, 20);

    // Linha de Vinco da Lateral / Reflexo
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x + 12, y + 20, 84, 3);

    // Teto / Colunas B e C (Estilo Creta 2025/2026)
    ctx.fillStyle = '#475569';
    ctx.fillRect(x + 30, y + 2, 50, 14);

    // Teto Solar Panorâmico Escuro
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x + 36, y + 0, 38, 3);

    // Vidros Fumê (Dianteiro, Traseiro e Laterais)
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + 34, y + 5, 20, 10); // Vidro Traseiro Lateral
    ctx.fillRect(x + 57, y + 5, 20, 10); // Vidro Dianteiro Lateral

    // Coluna C (Símbolo de Design do Creta em Prata)
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(x + 30, y + 5, 3, 10);

    // Faróis Dianteiros Full-LED (Assinatura retangular H do modelo 25/26)
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(x + 95, y + 16, 4, 8);
    ctx.fillStyle = '#38bdf8'; // DRL LED azulado
    ctx.fillRect(x + 96, y + 15, 2, 2);

    // Lanterna Traseira Interligada (Barra de LED Vermelha)
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(x + 8, y + 16, 4, 9);
    ctx.fillStyle = '#f87171';
    ctx.fillRect(x + 8, y + 18, 2, 5);

    // Grade Dianteira Paramétrica Escura
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x + 96, y + 23, 3, 8);

    // Para-choque Traseiro com Difusor Prata
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x + 8, y + 32, 10, 3);

    // Rodas de Liga Leve (Diamantadas)
    // Roda Traseira
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(x + 28, y + 36, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.arc(x + 28, y + 36, 5, 0, Math.PI * 2);
    ctx.fill();

    // Roda Dianteira
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(x + 80, y + 36, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.arc(x + 80, y + 36, 5, 0, Math.PI * 2);
    ctx.fill();

    // Retrovisor Cinza com Pisca LED
    ctx.fillStyle = '#475569';
    ctx.fillRect(x + 72, y + 12, 6, 4);
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(x + 76, y + 13, 2, 2);
}

function drawObstacle(obs) {
    // Sombra
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.ellipse(obs.x + 40, obs.y + 35, 38, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cor do Veículo
    ctx.fillStyle = obs.color;
    ctx.fillRect(obs.x, obs.y + 10, 80, 22);
    ctx.fillRect(obs.x + 20, obs.y, 42, 12);

    // Vidros
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(obs.x + 23, obs.y + 3, 16, 8);
    ctx.fillRect(obs.x + 42, obs.y + 3, 16, 8);

    // Rodas
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(obs.x + 20, obs.y + 30, 7, 0, Math.PI * 2);
    ctx.arc(obs.x + 62, obs.y + 30, 7, 0, Math.PI * 2);
    ctx.fill();

    // Luzes Dianteiras/Traseiras
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(obs.x + 78, obs.y + 13, 3, 6);
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(obs.x, obs.y + 13, 3, 6);
}

function drawPalmTree(tree) {
    const tx = tree.x;
    const ty = 185; // Fixados estritamente na calçada/orla superior

    // Tronco
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + 12, ty - 25, tx + 5, ty - 50);
    ctx.stroke();

    // Folhas do Coqueiro
    ctx.fillStyle = '#15803d';
    const topX = tx + 5;
    const topY = ty - 50;

    for (let i = 0; i < 5; i++) {
        const angle = (i * Math.PI / 2.5) - Math.PI / 4;
        ctx.beginPath();
        ctx.arc(topX + Math.cos(angle) * 16, topY + Math.sin(angle) * 12, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    // Coqueiros (Frutas)
    ctx.fillStyle = '#a16207';
    ctx.beginPath();
    ctx.arc(topX - 2, topY + 3, 3, 0, Math.PI * 2);
    ctx.arc(topX + 3, topY + 4, 3, 0, Math.PI * 2);
    ctx.fill();
}

// DRAW HIGHWAY CHECKPOINT BOOTH (Ponto de Controle de Rodovia)
function drawCheckpointBooth(x) {
    if (x < -200 || x > canvas.width + 200) return;

    // Structure Canopy
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(x, 190, 140, 35);
    ctx.fillStyle = '#0369a1';
    ctx.fillRect(x, 220, 140, 8);

    // Support Pillars
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(x + 10, 228, 8, 205);
    ctx.fillRect(x + 122, 228, 8, 205);

    // Toll / Control Booths
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + 50, 280, 40, 70);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(x + 55, 290, 30, 25); // Booth Window

    // Signboard text
    ctx.fillStyle = '#fef08a';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText('CONTROLE KM 5', x + 22, 212);
}

function update() {
    if (gameOver) return;

    // CHECKPOINT AT 5.00 KM (5000 METERS) MECHANIC
    if (distanceMeters >= 5000 && !checkpointTriggered) {
        checkpointTriggered = true;
        checkpointState = 'SLOWING';
        checkpointBoothX = canvas.width + 50;
    }

    if (checkpointTriggered) {
        if (checkpointState === 'SLOWING') {
            // Auto slow down car to 20 km/h smoothly
            speed += (20 - speed) * 0.08;
            checkpointBoothX -= speed * 0.12;

            if (Math.abs(speed - 20) < 3) {
                speed = 20;
                checkpointState = 'SPEECH';
                checkpointTimer = 0;
                speechBubble.style.display = 'block';
            }
        } else if (checkpointState === 'SPEECH') {
            checkpointTimer++;
            checkpointBoothX -= speed * 0.12;

            // Align speech bubble directly above Creta
            speechBubble.style.left = `${player.x + 10}px`;
            speechBubble.style.top = `${player.y - 35}px`;

            if (checkpointTimer > 110) { // After ~2 seconds
                speechBubble.style.display = 'none';
                checkpointState = 'BOOSTING';
                checkpointTimer = 0;
            }
        } else if (checkpointState === 'BOOSTING') {
            // Sudden high acceleration boost up to 195 km/h!
            speed += 3.5;
            checkpointBoothX -= speed * 0.12;

            if (speed >= 195) {
                checkpointState = 'COMPLETED';
            }
        } else if (checkpointState === 'COMPLETED') {
            checkpointBoothX -= speed * 0.12;
            // Normal speed controls resume
            handleStandardSpeedControls();
        }
    } else {
        handleStandardSpeedControls();
    }

    function handleStandardSpeedControls() {
        if (keys['ArrowRight']) {
            speed += 0.7; // Acelera
        } else if (keys['ArrowLeft']) {
            speed -= 1.0; // Freia até o limite de 100 km/h
        } else {
            // Desaceleração suave de volta à velocidade normal
            if (speed > MIN_SPEED) speed -= 0.15;
        }
        // Travar velocidade mínima em 100 e máxima em 230 km/h
        speed = Math.max(MIN_SPEED, Math.min(230, speed));
    }

    // Atualizar HUD da Velocidade
    speedVal.innerHTML = `${Math.floor(speed)} <span style="font-size: 12px;">km/h</span>`;
    if (speed > 180) {
        speedVal.classList.add('speed-high');
    } else {
        speedVal.classList.remove('speed-high');
    }

    // Atualizar Distância Percorrida (KM)
    distanceMeters += speed * (1 / 60) * 0.28; // Conversão aproximada para metros por frame
    kmVal.innerHTML = `${(distanceMeters / 1000).toFixed(2)} <span style="font-size: 12px;">km</span>`;

    // Atualizar Relógio
    frameCounter++;
    if (frameCounter % 15 === 0) {
        timeMinutes = (timeMinutes + 1) % (24 * 60);
    }
    const hrs = String(Math.floor(timeMinutes / 60)).padStart(2, '0');
    const mins = String(Math.floor(timeMinutes % 60)).padStart(2, '0');
    timeVal.textContent = `${hrs}:${mins}`;

    // Controles de Troca de Faixa
    if (keys['ArrowUp'] && player.canChangeLane && player.lane > 0) {
        player.lane--;
        player.targetY = LANES[player.lane] - 22;
        player.canChangeLane = false;
    }
    if (keys['ArrowDown'] && player.canChangeLane && player.lane < 3) {
        player.lane++;
        player.targetY = LANES[player.lane] - 22;
        player.canChangeLane = false;
    }

    // Movimento suave de mudança de faixa
    player.y += (player.targetY - player.y) * 0.22;

    // Movimentação dos Coqueiros na Orla
    palmTrees.forEach(tree => {
        tree.x -= speed * 0.08;
        if (tree.x < -40) {
            tree.x = canvas.width + Math.random() * 80;
        }
    });

    // Gerar Veículos no Tráfego (pause traffic during checkpoint speech)
    if (checkpointState !== 'SPEECH') {
        spawnTimer++;
        if (spawnTimer > Math.max(25, 110 - (speed * 0.3))) {
            spawnTimer = 0;
            const randomLane = Math.floor(Math.random() * 4);
            const colors = ['#e11d48', '#2563eb', '#ca8a04', '#16a34a', '#9333ea', '#ea580c'];

            obstacles.push({
                x: canvas.width + 60,
                y: LANES[randomLane] - 18,
                width: 80,
                height: 36,
                lane: randomLane,
                speedOffset: Math.random() * 25 - 12,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }
    }

    // Atualizar Posição dos Veículos e Checar Colisão
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= (speed * 0.12) - (obs.speedOffset * 0.05);

        // Caixa de Colisão
        if (
            player.x + 10 < obs.x + obs.width - 5 &&
            player.x + player.width - 10 > obs.x + 5 &&
            player.y + 8 < obs.y + obs.height - 5 &&
            player.y + player.height - 8 > obs.y + 5
        ) {
            gameOver = true;
            speechBubble.style.display = 'none';
            gameOverScreen.style.display = 'flex';
        }

        if (obs.x < -120) {
            obstacles.splice(i, 1);
        }
    }
}

function getSkyGradients() {
    let grad = ctx.createLinearGradient(0, 0, 0, 160);

    if (timeMinutes >= 360 && timeMinutes < 1020) {
        grad.addColorStop(0, '#fdba74');
        grad.addColorStop(0.6, '#f97316');
        grad.addColorStop(1, '#ef4444');
    } else if (timeMinutes >= 1020 && timeMinutes < 1140) {
        grad.addColorStop(0, '#4c1d95');
        grad.addColorStop(0.4, '#c026d3');
        grad.addColorStop(0.7, '#db2777');
        grad.addColorStop(1, '#f97316');
    } else {
        grad.addColorStop(0, '#020617');
        grad.addColorStop(0.7, '#0f172a');
        grad.addColorStop(1, '#1e1b4b');
    }
    return grad;
}

function draw() {
    // 1. Céu com Pôr do Sol Dinâmico
    ctx.fillStyle = getSkyGradients();
    ctx.fillRect(0, 0, canvas.width, 160);

    // Sol / Lua no Horizonte
    if (timeMinutes >= 1000 && timeMinutes < 1140) {
        ctx.fillStyle = '#fef08a';
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(650, 135, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // 2. Mar da Praia
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(0, 150, canvas.width, 25);
    
    ctx.fillStyle = '#38bdf8';
    for (let i = 0; i < canvas.width; i += 40) {
        let waveX = (i - (distanceMeters * 2) % 40);
        ctx.fillRect(waveX, 162, 20, 2);
    }

    // 3. Faixa de Areia
    ctx.fillStyle = '#fde047';
    ctx.fillRect(0, 175, canvas.width, 15);

    // 4. Calçadão / Orla com Coqueiros
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(0, 190, canvas.width, 35);
    
    ctx.fillStyle = '#94a3b8';
    for (let i = 0; i < canvas.width; i += 30) {
        let cx = (i - (distanceMeters * 3) % 30);
        ctx.fillRect(cx, 205, 12, 2);
    }

    // Desenhar Coqueiros na Orla
    palmTrees.forEach(drawPalmTree);

    // Guard-rail / Proteção de Borda
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(0, 222, canvas.width, 3);

    // 5. RODOVIA DE 4 FAIXAS
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 225, canvas.width, 210);

    // Linhas Amarelas Contínuas
    ctx.fillStyle = '#eab308';
    ctx.fillRect(0, 225, canvas.width, 4);
    ctx.fillRect(0, 431, canvas.width, 4);

    // 3 Linhas Divisórias Brancas Tracejadas
    ctx.fillStyle = '#f8fafc';
    const dashWidth = 35;
    const gapWidth = 25;
    const totalDash = dashWidth + gapWidth;
    let offset = (distanceMeters * 8) % totalDash;

    for (let l = 1; l < 4; l++) {
        let lineY = 225 + (l * LANE_HEIGHT);
        for (let x = -totalDash; x < canvas.width + totalDash; x += totalDash) {
            ctx.fillRect(x - offset, lineY - 1, dashWidth, 3);
        }
    }

    // Draw Checkpoint Booth at KM 5
    if (checkpointBoothX > -200 && checkpointBoothX < canvas.width + 200) {
        drawCheckpointBooth(checkpointBoothX);
    }

    // Calçada Inferior
    ctx.fillStyle = '#334155';
    ctx.fillRect(0, 435, canvas.width, 45);

    // 6. OBSTÁCULOS E CRETA 25/26
    obstacles.forEach(drawObstacle);
    drawCreta25(player.x, player.y);
}

// LOOP PRINCIPAL (60 FPS)
function gameLoop() {
    update();
    draw();
    if (!gameOver) {
        requestAnimationFrame(gameLoop);
    }
}

requestAnimationFrame(gameLoop);
</script>
